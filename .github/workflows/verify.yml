name: verify

on:
  push:
  pull_request:

jobs:
  static-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Repository verifier
        run: python tools/verify_repo.py
